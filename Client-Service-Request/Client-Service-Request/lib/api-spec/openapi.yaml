openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: client-intake
    description: Public client service requests
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /client/requests:
    post:
      operationId: createClientServiceRequest
      tags: [client-intake]
      summary: Submit a client service request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientServiceRequestInput"
      responses:
        "201":
          description: Service request received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientServiceRequestSubmitted"
        "400":
          description: Request details are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many requests from this connection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ServiceClass:
      type: string
      enum: [storage, real_estate, estate, commercial, junk, package]
    ClientServiceRequestInput:
      type: object
      additionalProperties: false
      properties:
        serviceClass:
          $ref: "#/components/schemas/ServiceClass"
        fullName: { type: string, minLength: 1, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254 }
        phone: { type: ["string", "null"], maxLength: 80 }
        jobLocation: { type: string, minLength: 2, maxLength: 240 }
        description: { type: string, minLength: 10, maxLength: 1600 }
        preferredDate: { type: ["string", "null"], format: date }
        consentToContact: { type: boolean, const: true }
      required:
        - serviceClass
        - fullName
        - email
        - phone
        - jobLocation
        - description
        - preferredDate
        - consentToContact
    ClientServiceRequestSubmitted:
      type: object
      additionalProperties: false
      properties:
        requestId: { type: string, format: uuid }
        submittedAt: { type: string, format: date-time }
        message: { type: string }
      required: [requestId, submittedAt, message]
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error: { type: string }
      required: [error]
