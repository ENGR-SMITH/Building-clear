kind = "web"
previewPath = "/"
title = "Bizlit Landing Page"
description = "A standalone extraction of Bizlit’s public marketing landing page, preserving its original content and visuals without the dashboard, auth screens, or backend."
version = "1.0.0"
id = "artifacts/bizlit-landing"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24409

[services.development]
run = "pnpm --filter @workspace/bizlit-landing run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/bizlit-landing", "run", "build" ]
serve = "static"
publicDir = "artifacts/bizlit-landing/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24409"
BASE_PATH = "/"
